[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "institutional-knowledge-engine"
version = "0.13.4"
description = "Open-source-first internal document Q&A, research, and report analysis platform"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0.41,<2.1",
  "psycopg[binary,pool]>=3.2.9,<4",
  "pgvector>=0.4,<1",
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "openai>=1.99,<3",
  "httpx>=0.28,<1",
  "langgraph>=1.2.10,<1.3",
  "celery[redis]>=5.5,<6",
  "jinja2>=3.1,<4",
  "orjson>=3.10,<4",
  "prometheus-client>=0.22,<1",
  "python-json-logger>=3.3,<4",
  "PyMuPDF>=1.26,<2",
]

[project.optional-dependencies]
ml-optimized = [
  "sentence-transformers[onnx,openvino]>=5,<6",
]
ingest = [
  "docling==2.123.1",
  "transformers>=4.50,<5",
]
ml = [
  "sentence-transformers>=5,<6",
  "torch>=2.13,<2.14",
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2",
  "types-PyJWT>=1.7,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ike = ["web/templates/*.html", "web/static/*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
